[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draftkv-minimal"
version = "0.1.0"
description = "DraftKV research implementation and source-locked execution interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/TillyEndless/DraftKV-public"
Documentation = "https://github.com/TillyEndless/DraftKV-public/blob/main/docs/INSTALL.md"

[project.scripts]
draftkv-minimal = "draftkv_minimal.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["draftkv_minimal"]
namespaces = false

[tool.setuptools.package-data]
draftkv_minimal = ["runtimes.json", "verified/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
