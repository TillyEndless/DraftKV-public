name: CPU release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public CPU tooling
        run: python -m pip install --upgrade pip build pytest
      - name: Install package
        run: python -m pip install -e .
      - name: CPU contracts and source integrity
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q
          python tools/check_release.py
          for backbone in LongLive1.3B LingBot1.3B LingBot14B SolarWM33B; do
            ./reproduce.sh static-check --backbone "$backbone" --profile off
            ./reproduce.sh static-check --backbone "$backbone" --profile summary
          done
      - name: Build and inspect distributions
        run: |
          python -m build
          mkdir -p /tmp/draftkv-sdist-source /tmp/draftkv-sdist-wheel
          tar -xzf dist/draftkv_minimal-0.1.0.tar.gz -C /tmp/draftkv-sdist-source
          python -m build --wheel --outdir /tmp/draftkv-sdist-wheel /tmp/draftkv-sdist-source/draftkv_minimal-0.1.0
          python tools/check_release.py --wheel dist/draftkv_minimal-0.1.0-py3-none-any.whl --sdist dist/draftkv_minimal-0.1.0.tar.gz --rebuilt-wheel /tmp/draftkv-sdist-wheel/draftkv_minimal-0.1.0-py3-none-any.whl
